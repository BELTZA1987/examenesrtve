name: Publicar web en GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "actualizar.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"

  workflow_run:
    workflows:
      - "RTVE - Examen automatico diario"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar sitio

    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar la versión más reciente de main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos públicos
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site

          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            --exclude="scripts/" \
            --exclude="reference/" \
            --exclude="requirements.txt" \
            --exclude="netlify.toml" \
            --exclude="README.md" \
            ./ _site/

          test -f _site/index.html
          test -f _site/data/exams.json

          echo "Archivos preparados:"
          find _site -maxdepth 3 -type f | sort

      - name: Subir archivos de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
