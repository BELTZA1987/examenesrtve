name: Generar examen diario

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Crear otro examen aunque ya exista uno de hoy"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "55 10 * * *"
      timezone: "Europe/Madrid"

    - cron: "00 11 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

# Evita dos generaciones simultáneas.
concurrency:
  group: examen-diario-rtve
  cancel-in-progress: false

jobs:
  generate:
    name: Crear y publicar examen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Europe/Madrid

    steps:
      # 1. Descarga el contenido del repositorio.
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      # 2. Comprueba que todos los archivos estén
      # en las carpetas correctas.
      - name: Comprobar archivos necesarios
        shell: bash
        run: |
          archivos=(
            "data/exams.json"
            "scripts/generate_exam.py"
            "reference/rtve_topics.txt"
            "requirements.txt"
          )

          for archivo in "${archivos[@]}"; do
            if [ ! -f "$archivo" ]; then
              echo "ERROR: falta el archivo $archivo"
              exit 1
            fi

            echo "OK: $archivo"
          done

      # 3. Prepara Python.
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # 4. Instala la biblioteca oficial de OpenAI.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Genera el nuevo examen.
      - name: Generar examen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          FORCE_CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          python scripts/generate_exam.py

      # 6. Comprueba que exams.json siga siendo válido.
      - name: Validar archivo de exámenes
        run: |
          python -m json.tool data/exams.json > /dev/null
          echo "data/exams.json es válido."

      # 7. Guarda el examen en GitHub.
      - name: Guardar y publicar cambio
        shell: bash
        run: |
          if git diff --quiet -- data/exams.json; then
            echo "No hay cambios que publicar."
            echo "Probablemente ya existía un examen de hoy."
            exit 0
          fi

          git config user.name "rtve-exam-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/exams.json
          git commit -m "Añadir examen diario $(date +'%Y-%m-%d')"

          git push origin "HEAD:${{ github.event.repository.default_branch }}"
