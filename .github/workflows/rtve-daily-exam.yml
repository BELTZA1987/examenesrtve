name: Examen diario RTVE

run-name: Generar y publicar examen RTVE #${{ github.run_number }}

on:
  # Ejecución manual desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      force:
        description: "Crear otro examen aunque ya exista uno de hoy"
        required: false
        default: true
        type: boolean

  # Ejecución automática diaria a las 09:17,
  # utilizando la hora local de Madrid.
  schedule:
    - cron: "17 9 * * *"
      timezone: "Europe/Madrid"

# Evita que dos publicaciones se ejecuten simultáneamente.
concurrency:
  group: rtve-github-pages
  cancel-in-progress: true

jobs:
  generate:
    name: Generar examen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # 1. Descargar el repositorio.
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # 2. Configurar Python.
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Instalar las dependencias.
      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          else
            echo "::warning::No existe requirements.txt. Se instalará openai."
            python -m pip install openai
          fi

      # 4. Comprobar que existe la clave de OpenAI.
      - name: Comprobar clave de OpenAI
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::No existe el secreto OPENAI_API_KEY."
            echo "::error::Créalo en Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "La clave OPENAI_API_KEY está disponible."

      # 5. Mostrar el tipo de ejecución.
      - name: Comprobar modo de generación
        shell: bash
        env:
          FORCE_CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Crear otro examen: ${FORCE_CREATE}"

      # 6. Generar el examen.
      #
      # IMPORTANTE:
      # Tu script utiliza FORCE_CREATE, no FORCE_NEW_EXAM.
      - name: Generar examen
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: |
          python scripts/generate_exam.py

      # 7. Comprobar que existen los archivos.
      - name: Comprobar archivos generados
        shell: bash
        run: |
          if [ ! -f "index.html" ]; then
            echo "::error::No se encuentra index.html."
            exit 1
          fi

          if [ ! -f "data/exams.json" ]; then
            echo "::error::No se encuentra data/exams.json."
            exit 1
          fi

          echo "Archivos encontrados:"
          ls -lh index.html data/exams.json

      # 8. Comprobar si realmente se creó un examen nuevo.
      - name: Comprobar cambios del examen
        id: changes
        shell: bash
        env:
          FORCE_CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: |
          if git diff --quiet -- data/exams.json; then
            echo "changed=false
