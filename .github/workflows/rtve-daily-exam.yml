name: RTVE - Examen automatico diario

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Crear otro examen aunque ya exista uno de hoy"
        required: false
        default: false
        type: boolean

  schedule:
    # Dos intentos diarios. Si el primero crea el examen,
    # el segundo detecta que ya existe y no consume la API.
    - cron: "17,47 8 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: rtve-examen-diario
  cancel-in-progress: false

jobs:
  generate_exam:
    name: Generar y publicar examen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      OPENAI_MODEL: gpt-5-mini
      TZ: Europe/Madrid

    steps:
      - name: Mostrar datos de la ejecucion
        shell: bash
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Rama predeterminada: ${DEFAULT_BRANCH}"
          echo "Fecha Madrid: $(date '+%Y-%m-%d %H:%M:%S %Z')"

          {
            echo "## Ejecucion del examen RTVE"
            echo ""
            echo "- Evento: \`${{ github.event_name }}\`"
            echo "- Rama: \`${DEFAULT_BRANCH}\`"
            echo "- Fecha Madrid: \`$(date '+%Y-%m-%d %H:%M:%S %Z')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Descargar rama predeterminada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Comprobar archivos del proyecto
        shell: bash
        run: |
          set -euo pipefail

          archivos=(
            "data/exams.json"
            "reference/rtve_topics.txt"
            "scripts/generate_exam.py"
            "requirements.txt"
          )

          for archivo in "${archivos[@]}"; do
            if [[ ! -f "$archivo" ]]; then
              echo "::error file=$archivo::Falta el archivo obligatorio: $archivo"
              exit 1
            fi

            echo "OK: $archivo"
          done

      - name: Validar JSON antes de generar
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/exams.json > /dev/null
          echo "JSON inicial valido."

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Comprobar clave de OpenAI
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::No existe el secreto OPENAI_API_KEY."
            exit 1
          fi

          echo "El secreto OPENAI_API_KEY esta configurado."

      - name: Generar examen
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          FORCE_CREATE=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
             && [[ "${MANUAL_FORCE:-false}" == "true" ]]; then
            FORCE_CREATE=true
          fi

          export FORCE_CREATE

          echo "Evento recibido: ${{ github.event_name }}"
          echo "Creacion forzada: ${FORCE_CREATE}"

          python scripts/generate_exam.py

      - name: Validar JSON generado
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/exams.json > /dev/null
          echo "JSON final valido."

      - name: Publicar examen en el repositorio
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/exams.json; then
            echo "No hay cambios. Probablemente ya existe el examen de hoy."

            {
              echo ""
              echo "### Resultado"
              echo "No se creo otro examen porque no habia cambios que publicar."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          git config user.name "rtve-exam-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/exams.json
          git commit -m "Añadir examen diario $(date '+%Y-%m-%d')"

          git pull --rebase origin "${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

          {
            echo ""
            echo "### Resultado"
            echo "Examen generado y publicado correctamente."
          } >> "$GITHUB_STEP_SUMMARY"
