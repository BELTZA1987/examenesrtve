name: RTVE - Examen automatico diario

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Crear otro examen aunque ya exista uno de hoy"
        required: false
        default: false
        type: boolean

  # GitHub interpreta cron en UTC.
  # Se programan 06:17-08:47 UTC y después se filtra por hora de Madrid.
  # Así funciona tanto con horario de verano como de invierno.
  schedule:
    - cron: "17,47 6-8 * * *"

permissions:
  contents: write

concurrency:
  group: rtve-examen-diario
  cancel-in-progress: false

jobs:
  generate_exam:
    name: Generar y publicar examen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      OPENAI_MODEL: gpt-5-mini
      TZ: Europe/Madrid

    steps:
      - name: Comprobar ventana horaria
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_RUN=false
          MADRID_HOUR="$(TZ=Europe/Madrid date '+%H')"
          MADRID_DATE="$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_RUN=true
          elif [[ "$MADRID_HOUR" == "08" || "$MADRID_HOUR" == "09" ]]; then
            SHOULD_RUN=true
          fi

          echo "run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Hora de Madrid: $MADRID_DATE"
          echo "Ejecutar generador: $SHOULD_RUN"

          {
            echo "## Ejecucion del examen RTVE"
            echo ""
            echo "- Evento: \`${{ github.event_name }}\`"
            echo "- Hora de Madrid: \`$MADRID_DATE\`"
            echo "- Ejecutar generador: \`$SHOULD_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Descargar rama predeterminada
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Comprobar archivos del proyecto
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          archivos=(
            "data/exams.json"
            "reference/rtve_topics.txt"
            "scripts/generate_exam.py"
            "requirements.txt"
          )

          for archivo in "${archivos[@]}"; do
            if [[ ! -f "$archivo" ]]; then
              echo "::error file=$archivo::Falta el archivo obligatorio: $archivo"
              exit 1
            fi
            echo "OK: $archivo"
          done

      - name: Validar JSON antes de generar
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/exams.json > /dev/null
          echo "JSON inicial valido."

      - name: Configurar Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Comprobar clave de OpenAI
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::No existe el secreto OPENAI_API_KEY."
            exit 1
          fi

          echo "El secreto OPENAI_API_KEY esta configurado."

      - name: Generar examen
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          FORCE_CREATE=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
             && [[ "${MANUAL_FORCE:-false}" == "true" ]]; then
            FORCE_CREATE=true
          fi

          export FORCE_CREATE

          echo "Evento recibido: ${{ github.event_name }}"
          echo "Creacion forzada: ${FORCE_CREATE}"

          set +e
          python scripts/generate_exam.py
          STATUS=$?
          set -e

          if [[ "$STATUS" -eq 4 ]]; then
            echo "::error::OpenAI ha rechazado la solicitud por limite temporal o falta de cuota. Revisa el detalle inmediatamente anterior y la facturacion de la API."
          elif [[ "$STATUS" -ne 0 ]]; then
            echo "::error::El generador termino con el codigo $STATUS."
          fi

          exit "$STATUS"

      - name: Validar JSON generado
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/exams.json > /dev/null
          echo "JSON final valido."

      - name: Publicar examen en el repositorio
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/exams.json; then
            echo "No hay cambios. Probablemente ya existe el examen de hoy."

            {
              echo ""
              echo "### Resultado"
              echo "No se creo otro examen porque ya existia uno de hoy o no habia cambios."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          git config user.name "rtve-exam-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/exams.json
          git commit -m "Añadir examen diario $(TZ=Europe/Madrid date '+%Y-%m-%d')"

          git pull --rebase origin "${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

          {
            echo ""
            echo "### Resultado"
            echo "Examen generado y publicado correctamente."
          } >> "$GITHUB_STEP_SUMMARY"
