- name: Generar examen diario
  shell: bash
  run: |
    python scripts/generate_exam.py

on:
  workflow_dispatch:

  schedule:
    - cron: "17 9 * * *"
      timezone: "Europe/Madrid"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generar examen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pages: read

    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Generar examen diario
        shell: bash
        run: |
          python scripts/generate_exam.py

      - name: Comprobar examen generado
        shell: bash
        run: |
          if [ ! -f "index.html" ]; then
            echo "::error::No se encuentra index.html"
            exit 1
          fi

          if [ ! -f "data/exams.json" ]; then
            echo "::error::No se encuentra data/exams.json"
            exit 1
          fi

          echo "Examen generado correctamente:"
          ls -lh index.html data/exams.json

      - name: Guardar examen en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/exams.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que guardar."
          else
            git commit -m "Examen diario $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Preparar web
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            --exclude="scripts/" \
            --exclude="requirements.txt" \
            --exclude="__pycache__/" \
            --exclude="*.py" \
            --exclude="*.pyc" \
            ./ _site/

          touch _site/.nojekyll

          echo "Archivos que se publicarán:"
          find _site -maxdepth 4 -type f | sort

          test -f "_site/index.html"
          test -f "_site/data/exams.json"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Crear nombre del artefacto
        id: artifact_name
        shell: bash
        run: |
          echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Subir web para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ./_site
          retention-days: 1

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
          timeout: 600000
